<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Aquarium</title>
    <link rel="stylesheet" type="text/css" href="WifiManager.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="title">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="wifi-icon" aria-hidden="true">
                        <path d="M12 18.5c.7 0 1.25.55 1.25 1.25S12.7 21 12 21s-1.25-.55-1.25-1.25S11.3 18.5 12 18.5z" />
                        <path d="M8.5 16a6 6 0 0 1 7 0" />
                        <path d="M6 13a9 9 0 0 1 12 0" />
                        <path d="M3.5 10a12 12 0 0 1 17 0" />
                    </svg>
                </div>
                <div>
                    <h1>Wi-Fi STA</h1>
                    <div class="hint" style="margin:0">Host: <span id="sta-host"></span></div>
                </div>
            </div>
        </div>

        <div class="card">
            <nav class="sec" aria-label="Menü">
                <h2>Menü</h2>
                <div class="stack">
                    <a class="btn" href="/led">💡 LED</a>
                    <a class="btn" href="/config">🕒 Uhr &amp; Ort</a>
                    <a class="btn" href="/settings">📶 WLAN</a>
                </div>
            </nav>
            <section class="sec">
                <h2>Status</h2>
                <div class="hint">STA-IP: <code id="sta-ip"></code></div>
            </section>
        </div>

        <footer class="copyright">
            © 2026 R.Wisser · <span id="ver-footer"></span>
        </footer>
    </div>

    <script>
        (function () {
            const VERSION = "2.0.4";
            document.getElementById("ver-footer").textContent = "v" + VERSION;
            document.getElementById("sta-host").textContent = location.hostname || "device.local";
            document.getElementById("sta-ip").textContent = location.host || "0.0.0.0";
        })();
    </script>
</body>
</html>
