<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fehler beim Speichern</title>
    <link rel="stylesheet" type="text/css" href="WifiManager.css">
</head>
<body>
    <main class="card" role="status" aria-live="polite">
        <!-- SVG icon with cross + pulse -->
        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="var(--err2)" />
                        <stop offset="100%" stop-color="var(--err1)" />
                    </linearGradient>
                </defs>

                <!-- Pulsing arc (outline only) -->
                <circle
                    class="pulse"
                    cx="32"
                    cy="32"
                    r="23"
                    fill="none"
                    stroke="url(#g)"
                    stroke-width="4" />

                <!-- Red disk -->
                <circle class="disc" cx="32" cy="32" r="22" fill="url(#g)" />

                <!-- rounded cross -->
                <path
                    d="M24 24 L40 40 M24 40 L40 24"
                    fill="none"
                    stroke="#fff"
                    stroke-width="4.5"
                    stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>
        <div class="center">
            <h1>Fehler beim Speichern</h1>
        </div>
        <div class="center">
            <p class="muted">Die Daten konnten nicht gespeichert werden oder es fehlen Felder.</p>
        </div>
        <div class="center">
            <p class="small"><a href="/">Zurück zum Formular und erneut versuchen.</a></p>
        </div>
        <nav class="pagenav" aria-label="Navigation">
            <a class="btn" href="/">🏠 Startseite</a>
        </nav>
    </main>
</body>
</html>
